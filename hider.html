<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Orbitron:wght@700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #111827; /* gray-900 */
            color: #e5e7eb; /* gray-200 */
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Seeker View Billboard Styles */
        .seeker-view {
            background-color: #000;
            border-bottom: 4px solid #374151;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 250px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        .digital-font {
            font-family: 'Orbitron', sans-serif;
        }

        .glow-text-yellow {
            text-shadow: 0 0 10px rgba(253, 224, 71, 0.8), 0 0 20px rgba(253, 224, 71, 0.5);
        }
        
        .glow-text-red {
            text-shadow: 0 0 10px rgba(239, 68, 68, 0.8), 0 0 20px rgba(239, 68, 68, 0.5);
        }

        .glow-text-cyan {
            text-shadow: 0 0 10px rgba(34, 211, 238, 0.8), 0 0 20px rgba(34, 211, 238, 0.5);
        }

        .glow-text-white {
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease-in-out;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #1f2937; /* gray-800 */
            border: 1px solid #374151; /* gray-700 */
            border-radius: 0.75rem;
            padding: 1.5rem;
            max-width: 90%;
            width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            transform: scale(0.95);
            transition: transform 0.2s ease-in-out;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        /* Custom Scrollbar for Modal and main area */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1f2937; 
        }
        ::-webkit-scrollbar-thumb {
            background: #4b5563; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6b7280; 
        }
        
        /* Card UI */
        .game-card {
            background: linear-gradient(145deg, #374151, #1f2937);
            border: 1px solid #4b5563;
            transition: transform 0.1s, box-shadow 0.1s;
            cursor: pointer;
        }
        .game-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            border-color: #60a5fa;
        }
        .game-card.selected {
            border-color: #10b981;
            box-shadow: 0 0 0 2px #10b981;
        }

        /* Role Specific Styles */
        body.role-seeker #controlPanelContainer {
            display: none !important;
        }
        body.role-seeker #seekerView {
            height: 100vh;
            border-bottom: none;
        }
    </style>
</head>

                HIDER (Host)
            </button>
            <button onclick="selectRole('SEEKER')" class="flex-1 bg-gradient-to-b from-red-600 to-red-800 hover:from-red-500 hover:to-red-700 text-white font-bold py-6 px-8 rounded-xl shadow-[0_0_20px_rgba(220,38,38,0.5)] border border-red-400 text-xl transition-all hover:scale-105">

            </button>
        </div>
    </div>

        </div>
    </div>

        <div id="localStatus" class="text-lg text-emerald-400 font-semibold mb-4">SYSTEM READY</div>

        <div id="pauseControlContainer" class="hidden mb-6">

            </button>
        </div>

        <!-- Initial Start Button -->
        <div id="startPhaseContainer" class="flex flex-col items-center gap-4">
            <!-- Mode Selection -->
            <div id="modeSelection" class="flex bg-gray-800 p-1 rounded-lg border border-gray-600 mb-2">
                <button onclick="setMode('mini')" id="btn-mode-mini" class="bg-blue-600 text-white font-bold py-2 px-4 rounded shadow">Mini (1x)</button>
                <button onclick="setMode('small')" id="btn-mode-small" class="text-gray-400 hover:text-white font-bold py-2 px-4 rounded transition-colors">Small (2x)</button>
                <button onclick="setMode('medium')" id="btn-mode-medium" class="text-gray-400 hover:text-white font-bold py-2 px-4 rounded transition-colors">Medium (3x)</button>
            </div>

            <button id="btnStartHiding" onclick="beginHiding()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 px-8 rounded-lg shadow-lg text-xl transition-colors w-64 text-center">
                START HIDING (15m)
            </button>
        </div>

        <!-- Hiding Phase Controls (Hidden initially) -->
        <div id="hidingControls" class="hidden flex-col items-center gap-4">
            <button onclick="startMainGame()" class="bg-orange-600 hover:bg-orange-500 text-white font-bold py-2 px-6 rounded-lg shadow transition-colors">
                SKIP HIDING PHASE
            </button>
        </div>
        
        <!-- Move Phase Controls (Hidden initially) -->
        <div id="moveControls" class="hidden flex-col items-center gap-4 mt-8">
            <button id="btnStartMove" onclick="startMoveTimer()" class="bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-4 px-8 rounded-lg shadow-lg text-xl transition-colors text-center">
                START 5m RELOCATION
            </button>
            <button onclick="startMainGame()" class="bg-orange-600 hover:bg-orange-500 text-white font-bold py-2 px-6 rounded-lg shadow transition-colors">
                SKIP MOVE RELOCATION
            </button>
        </div>

        <!-- Main Game Controls (Hidden initially) -->
        <div id="mainControls" class="hidden flex-col w-full max-w-md gap-4">
            <button onclick="showDrawMenu()" class="bg-gray-700 hover:bg-gray-600 border border-gray-600 text-white font-bold py-3 px-6 rounded-lg shadow transition-colors w-full text-lg">

            <button onclick="inspectHand()" class="bg-gray-700 hover:bg-gray-600 border border-gray-600 text-white font-bold py-3 px-6 rounded-lg shadow transition-colors w-full text-lg flex justify-between px-8">

    </div>

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        // --- AUDIO SOUND CUE SYSTEM (LOUDER & LONGER) --- //
        function playCurseSound() {
            try {
                const audioCtx = getAudioContext();
                
                const now = audioCtx.currentTime;
                
                for (let i = 0; i < 5; i++) {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(440, now + (i * 0.25));
                    osc.frequency.linearRampToValueAtTime(880, now + (i * 0.25) + 0.2);
                    
                    gain.gain.setValueAtTime(0.5, now + (i * 0.25));
                    gain.gain.exponentialRampToValueAtTime(0.01, now + (i * 0.25) + 0.22);
                    
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    
                    osc.start(now + (i * 0.25));
                    osc.stop(now + (i * 0.25) + 0.22);
                }
            } catch (e) {
                console.error("Audio playback error:", e);
            }
        }
        
            function playHornSound() {
                try {
                    const audioCtx = getAudioContext();
        
                    const now = audioCtx.currentTime;
                    const duration = 1.8;
        
                    // Frequencies forming a loud major chord (D4, F#4, A4)
                    const freqs = [293.66, 369.99, 440.00];

                    freqs.forEach((freq) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();

                        osc.type = 'sawtooth';
            
                        // Pneumatic pressure burst: start slightly higher and drop instantly to pitch
                        osc.frequency.setValueAtTime(freq * 1.08, now);
                        osc.frequency.exponentialRampToValueAtTime(freq, now + 0.05);

                        gain.gain.setValueAtTime(0, now);
                        gain.gain.linearRampToValueAtTime(0.3, now + 0.03); // Instant burst
                        gain.gain.setValueAtTime(0.3, now + duration - 0.3);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

                        osc.connect(gain);
                        gain.connect(audioCtx.destination);

                        osc.start(now);
                        osc.stop(now + duration);
                    });
                } catch (e) {
                    console.error("Audio playback error:", e);
                }
            }

        async function initGame() {
            try {
                app = initializeApp(firebaseConfig);
                db = getDatabase(app);
                
                document.getElementById('loadingOverlay').classList.add('hidden');

            } catch(e) {

            }

        window.selectRole = async function(selectedRole) {
            getAudioContext();
            const codeInput = document.getElementById('roomCodeInput');
            roomCode = codeInput && codeInput.value.trim() ? codeInput.value.trim().toUpperCase() : "GREENFIELD";
            role = selectedRole;
            document.getElementById('roleSelectionOverlay').classList.add('hidden');
            
            // Set room-specific references
            gameStateRef = ref(db, `rooms/${roomCode}/gameState`);
            const connectedRef = ref(db, '.info/connected');
            const presenceRef = ref(db, `rooms/${roomCode}/presence`);
            
            onValue(connectedRef, (snap) => {
                if (snap.val() === true) {
                    const myConnectionRef = push(presenceRef);
                    onDisconnect(myConnectionRef).remove();
                    set(myConnectionRef, true);
                }
            });

            onValue(presenceRef, (snap) => {
                const count = snap.exists() ? Object.keys(snap.val()).length : 0;
                const countEl = document.getElementById('playerCount');
                if (countEl) countEl.innerText = count + (count === 1 ? ' PLAYER' : ' PLAYERS');
            });
            
            if (role === 'SEEKER') {
                document.body.classList.add('role-seeker');
                if (gameStateRef) {
                    let lastActiveKeys = [];
                    onValue(gameStateRef, (snapshot) => {
                        if (snapshot.exists()) {
                            let data = snapshot.val();
                            previousPhase = gamePhase; // Store old phase
                            gamePhase = data.gamePhase || "IDLE"; // Update to new phase
                            isPaused = data.isPaused || false;
                            countdownTarget = data.countdownTarget || 0;
                            startTimestamp = data.startTimestamp || 0;
                            pauseTimestamp = data.pauseTimestamp || 0;
                            timeMultiplier = data.timeMultiplier || 1;
                            gameLog = data.gameLog || [];

// Play horn if transitioning from HIDING to RUNNING
                            if (previousPhase === "HIDING" && gamePhase === "RUNNING") {
                                playHornSound();
                            }
                            
                            let newCurses = data.activeCurses || {};
                            let newKeys = Object.keys(newCurses);
                            if (newKeys.length > lastActiveKeys.length) {
                                playCurseSound();
                            }
                            lastActiveKeys = newKeys;
                            activeCurses = newCurses;

                            renderActiveCurses(); 
                        } else {
                            gamePhase = "IDLE";
                            isPaused = false;
                            activeCurses = {};
                            lastActiveKeys = [];
                            renderActiveCurses();
                        }
                    }, (err) => console.error("Sync read error:", err));
                }
            } else {
                if (gameStateRef) {
                    let snap = await get(gameStateRef);
                    if (snap.exists() && snap.val().gamePhase && snap.val().gamePhase !== 'IDLE') {
                         let data = snap.val();
                         gamePhase = data.gamePhase;
                         isPaused = data.isPaused || false;
                         countdownTarget = data.countdownTarget || 0;
                         startTimestamp = data.startTimestamp || 0;
                         pauseTimestamp = data.pauseTimestamp || 0;
                         timeMultiplier = data.timeMultiplier || 1;
                         activeCurses = data.activeCurses || {};
                         
                         // Re-populate modifiers and hand so the state is kept correctly
                         hand = data.hand || [];
                         deck = data.deck || [];
                         maxHandSize = data.maxHandSize || 6;
                         divineBlessing = data.divineBlessing || false;
                         tinyHomeActive = data.tinyHomeActive || false;

                         gameLog = data.gameLog || [];
                         
                         document.getElementById('startPhaseContainer').classList.add('hidden');
                         if (gamePhase === "HIDING") {
                             document.getElementById('hidingControls').classList.remove('hidden');
                             document.getElementById('hidingControls').classList.add('flex');
                         } else {
                             document.getElementById('mainControls').classList.remove('hidden');
                             document.getElementById('mainControls').classList.add('flex');
                         }
                    } else {
                        // Start completely fresh
                        deck = initializeDeck();
                        hand = [];
                        pushStateToFirebase();
                    }
                }
            }
            
            updatePauseUI();
            if(!gameLoopInterval) gameLoopInterval = setInterval(updateLoop, 1000);
        }

        async function pushStateToFirebase() {
            if (role !== 'HIDER' || !gameStateRef) return;
            try {

                    countdownTarget,
                    startTimestamp,
                    pauseTimestamp,
                    timeMultiplier,
                    activeCurses: Object.keys(activeCurses).length > 0 ? activeCurses : null,
                    hand: hand.length > 0 ? hand : null,
                    deck: deck.length > 0 ? deck : null,
                    maxHandSize,
                    chaliceCount,
                    divineBlessing,
                    tinyHomeActive,
                    gameLog: gameLog.length > 0 ? gameLog : null
                });
            } catch(e) {
                console.error("State push error:", e);
            }
        }

        function getDisplayName(cardName) {
            if (cardName.includes("min")) {
                let val = parseInt(cardName.replace("min", ""));
                if (!isNaN(val)) {
                    return (val * timeMultiplier) + "min";
                }
            }
            if (cardName === "Curse of the 1-Minute King") {
                return "Curse of the " + (1 * timeMultiplier) + "-Minute King";
            }
            return cardName;
        }

        function getScaledDesc(desc) {
            if (timeMultiplier === 1) return desc;
            return desc
                .replace(/10 minutes/g, (10 * timeMultiplier) + " minutes")
                .replace(/15 minutes/g, (15 * timeMultiplier) + " minutes")
                .replace(/30 minutes/g, (30 * timeMultiplier) + " minutes")
                .replace(/5 minutes/g, (5 * timeMultiplier) + " minutes")
                .replace(/60 seconds/g, (60 * timeMultiplier) + " seconds")
                .replace(/30 seconds/g, (30 * timeMultiplier) + " seconds")
                .replace(/2.5 minutes/g, (2.5 * timeMultiplier) + " minutes")
                .replace(/2 minutes/g, (2 * timeMultiplier) + " minutes")
                .replace(/1-minute/gi, (1 * timeMultiplier) + "-minute");
        }

        function getScaledCost(cost_str) {
            if (timeMultiplier === 1) return cost_str;
            return cost_str
                .replace(/5 minutes/g, (5 * timeMultiplier) + " minutes")
                .replace(/2 minutes/g, (2 * timeMultiplier) + " minutes")
                .replace(/1-minute/gi, (1 * timeMultiplier) + "-minute");
        }

        // Shuffle helper
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function initializeDeck() {
            let curses = Object.keys(CARD_DATA).slice(0, 26);
            let powerUps = [
                ...Array(4).fill("Discard 1 Draw 2"), ...Array(4).fill("Discard 2 Draw 3"),
                ...Array(2).fill("Draw 1 Expand 1"), ...Array(1).fill("Draw 2 Expand 2"),
                ...Array(2).fill("Duplicate"), ...Array(4).fill("Randomize"),
                ...Array(4).fill("Veto"), ...Array(2).fill("Discard Me"), ...Array(1).fill("Move")
            ];
            let timeBonuses = [
                ...Array(25).fill("1min"), ...Array(14).fill("2min"),
                ...Array(11).fill("3min"), ...Array(4).fill("4min"),
                ...Array(2).fill("6min"), ...Array(4).fill("Total * 5%")
            ];
            return shuffle([...curses, ...powerUps, ...timeBonuses]);
        }

        function exportGameLog() {
            let logText = "GREENFIELD HIDE & SEEK - GAME LOG\n";
            logText += "=================================\n\n";
            logText += gameLog.join("\n");
            
            let blob = new Blob([logText], { type: 'text/plain' });
            let url = URL.createObjectURL(blob);
            let a = document.createElement('a');
            a.href = url;
            a.download = `Greenfield_GameLog_${new Date().toISOString().slice(0,10).replace(/-/g, "")}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function copyGameLog() {
            let logText = "GREENFIELD HIDE & SEEK - GAME LOG\n";
            logText += "=================================\n\n";
            logText += gameLog.join("\n");
    
            navigator.clipboard.writeText(logText).then(() => {
                const btn = document.getElementById('copyLogBtn');
                if (btn) {
                    let originalText = btn.innerHTML;
                    btn.innerHTML = "✅ COPIED!";
                    btn.classList.replace('bg-green-600', 'bg-emerald-500');
                    setTimeout(() => {
                        btn.innerHTML = originalText;
                        btn.classList.replace('bg-emerald-500', 'bg-green-600');
                    }, 2000);
                }
            }).catch(err => {
                console.error('Failed to copy: ', err);
                alert("Failed to copy log to clipboard.");
            });
        }

            document.getElementById('moveControls').classList.remove('flex');
            document.getElementById('mainControls').classList.add('hidden');

            // Reset identity & return to room lobby overlay

            document.body.classList.remove('role-seeker');
            document.getElementById('roleSelectionOverlay').classList.remove('hidden');

        function formatTime(totalSeconds) {
            let hrs = Math.floor(totalSeconds / 3600);
            let mins = Math.floor((totalSeconds % 3600) / 60);
            let secs = Math.floor(totalSeconds % 60);
            let mStr = mins.toString().padStart(2, '0');
            let sStr = secs.toString().padStart(2, '0');
            if (hrs > 0) return `${hrs.toString().padStart(2, '0')}:${mStr}:${sStr}`;
            return `${mStr}:${sStr}`;
        }

        function setMode(mode) {
            if (gamePhase !== "IDLE") return;
            
            const btnMini = document.getElementById('btn-mode-mini');
            const btnSmall = document.getElementById('btn-mode-small');
            const btnMedium = document.getElementById('btn-mode-medium');
            
            btnMini.className = "text-gray-400 hover:text-white font-bold py-2 px-4 rounded transition-colors";
            btnSmall.className = "text-gray-400 hover:text-white font-bold py-2 px-4 rounded transition-colors";
            btnMedium.className = "text-gray-400 hover:text-white font-bold py-2 px-4 rounded transition-colors";

            if (mode === 'mini') {
                timeMultiplier = 1;
                btnMini.className = "bg-blue-600 text-white font-bold py-2 px-4 rounded shadow";
            } else if (mode === 'small') {
                timeMultiplier = 2;
                btnSmall.className = "bg-blue-600 text-white font-bold py-2 px-4 rounded shadow";
            } else if (mode === 'medium') {
                timeMultiplier = 3;
                btnMedium.className = "bg-blue-600 text-white font-bold py-2 px-4 rounded shadow";
            }

            logEvent("Game Setup", `Difficulty mode set to ${mode.toUpperCase()} (${timeMultiplier}x)`);

            document.getElementById('btnStartHiding').innerText = `START HIDING (${15 * timeMultiplier}m)`;
            document.getElementById('btnStartMove').innerText = `START ${5 * timeMultiplier}m RELOCATION`;

        }

            const statusEl = document.getElementById('seekerStatus');
            const timeEl = document.getElementById('seekerTime');
            statusEl.textContent = status;
            timeEl.textContent = timeStr;
            
            statusEl.className = `text-3xl md:text-5xl font-bold digital-font mb-2 tracking-wider glow-text-${colorClass.split('-')[1]} ${colorClass}`;
            timeEl.className = `text-6xl md:text-8xl font-bold digital-font mb-4 glow-text-${colorClass.split('-')[1]} ${colorClass}`;

        function renderActiveCurses() {
            const container = document.getElementById('activeCursesContainer');
            container.innerHTML = '';
            for (let [name, data] of Object.entries(activeCurses)) {
                let rightSide = '';
                if (data.type === 'time') {
                    let leftSecs = Math.max(0, Math.floor(((data.expiresAt) - (isPaused ? pauseTimestamp : Date.now()))/1000));
                    rightSide = `<span class="text-yellow-400 font-bold font-mono text-xl">${formatTime(leftSecs)}</span>`;
                } else if (data.type === 'question') {
                    rightSide = `<span class="text-cyan-400 font-bold">${data.val} left</span>`;
                } else if (data.type === 'button') {
                    if (role === 'HIDER') {
                        rightSide = `<button onclick="event.stopPropagation(); removeCurse('${name}')" class="bg-gray-600 hover:bg-gray-500 text-white px-2 py-1 rounded text-sm">CLEAR</button>`;
                    } else {
                        rightSide = `<span class="text-gray-400 italic">ACTIVE</span>`;
                    }
                } else if (data.type === 'forever') {
                    rightSide = `<span class="text-gray-400 italic">ACTIVE</span>`;

                container.innerHTML += `

        function updatePauseUI() {
            const container = document.getElementById('pauseControlContainer');
            const btn = document.getElementById('btnTogglePause');
            const icon = document.getElementById('pauseBtnIcon');
            const text = document.getElementById('pauseBtnText');

            if (role === 'HIDER' && (gamePhase === "HIDING" || gamePhase === "RUNNING")) {
                container.classList.remove('hidden');
                if (isPaused) {
                    btn.className = "bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-8 rounded-lg shadow-lg text-lg transition-all text-center flex items-center justify-center gap-2 animate-pulse";

                    text.textContent = "RESUME GAME";

                    btn.className = "bg-amber-600 hover:bg-amber-500 text-white font-bold py-3 px-8 rounded-lg shadow-lg text-lg transition-all text-center flex items-center justify-center gap-2";

        function togglePause() {
            if (gamePhase !== "HIDING" && gamePhase !== "RUNNING") return;

            if (!isPaused) {
                // Pause action
                isPaused = true;
                pauseTimestamp = Date.now();
                logEvent("Game Paused", `Paused during ${gamePhase} phase`);
            } else {
                // Resume action
                let duration = Date.now() - pauseTimestamp;
                if (gamePhase === "RUNNING") {
                    startTimestamp += duration;
                } else if (gamePhase === "HIDING") {
                    countdownTarget += duration;
                }

                // Adjust expiration times of active curses so they freeze during pause
                for (let k in activeCurses) {
                    if (activeCurses[k].type === 'time' && activeCurses[k].expiresAt) {
                        activeCurses[k].expiresAt += duration;
                    }
                }

                isPaused = false;
                pauseTimestamp = 0;
                logEvent("Game Resumed", `Resumed ${gamePhase} phase`);
            }

            updatePauseUI();
            pushStateToFirebase();
        }

        function updateLoop() {
            let needsRender = false;
            updatePauseUI();

            if (gamePhase === "IDLE") {
                updateSeekerView("WAITING FOR HIDER", "00:00", "text-yellow-300");
            } else if (gamePhase === "HIDING") {
                if (isPaused) {
                    let left = Math.max(0, Math.floor((countdownTarget - pauseTimestamp) / 1000));
                    updateSeekerView("GAME PAUSED", formatTime(left), "text-yellow-400");
                    if (role === 'HIDER') document.getElementById('localStatus').textContent = `HIDING PAUSED: ${formatTime(left)}`;
                } else {
                    let left = Math.max(0, Math.floor((countdownTarget - Date.now())/1000));
                    updateSeekerView("HIDER IS HIDING...", formatTime(left), "text-yellow-300");
                    if (role === 'HIDER') document.getElementById('localStatus').textContent = `HIDING TIME LEFT: ${formatTime(left)}`;
                    
                    if (left <= 0 && role === 'HIDER') {
                        startMainGame();
                    }
                }
            } else if (gamePhase === "RUNNING") {
                if (isPaused) {
                    let elapsedSeconds = Math.max(0, Math.floor((pauseTimestamp - startTimestamp) / 1000));
                    updateSeekerView("GAME PAUSED", formatTime(elapsedSeconds), "text-yellow-400");
                    if (role === 'HIDER') document.getElementById('localStatus').textContent = `GAME PAUSED: ${formatTime(elapsedSeconds)}`;
                } else {
                    let elapsedSeconds = Math.floor((Date.now() - startTimestamp) / 1000);
                    updateSeekerView("SEEKERS RELEASED!", formatTime(elapsedSeconds), "text-red-500");
                    if (role === 'HIDER') document.getElementById('localStatus').textContent = `SURVIVAL TIMER: ${formatTime(elapsedSeconds)}`;
                    
                    if (role === 'HIDER') {
                        for (let name in activeCurses) {
                            if (activeCurses[name].type === 'time') {
                                if (Date.now() >= activeCurses[name].expiresAt) {
                                    delete activeCurses[name];
                                    pushStateToFirebase();
                                }
                                needsRender = true;
                            }
                        }
                    } else {
                         for (let name in activeCurses) {
                            if (activeCurses[name].type === 'time') needsRender = true;
                         }
                    }
                }
            } else if (gamePhase === "PAUSED") {
                updateSeekerView("TIMER PAUSED", "MOVE PHASE", "text-cyan-400");
                if (role === 'HIDER') document.getElementById('localStatus').textContent = "PAUSED: HIDER IS MOVING";
            } else if (gamePhase === "GAME_OVER") {
                updateSeekerView("GAME OVER", "END", "text-red-500");
            
    // Only trigger the modal once for the seeker
                if (role === 'SEEKER' && !document.getElementById('modalOverlay').classList.contains('active') && !hasShownGameOver) {
                    hasShownGameOver = true;
                    get(gameStateRef).then((snap) => {
                        if (snap.exists() && snap.val().finalStats) {
                            let stats = snap.val().finalStats;
                            const fmtStr = (sec) => {
                                let h = Math.floor(sec/3600);
                                let m = Math.floor((sec%3600)/60);
                                let s = Math.floor(sec%60);
                                return h > 0 ? `${h}h ${m}m ${s}s` : `${m}m ${s}s`;
                            };
                
                            let logHTML = snap.val().gameLog && snap.val().gameLog.length > 0 
                                ? snap.val().gameLog.map(entry => `<div class="font-mono text-xs text-gray-300 border-b border-gray-800 py-1">${entry}</div>`).join('') 
                                : '<p class="text-gray-400 italic">No events logged yet.</p>';

                            // Show the same modal the hider gets
                            showModal(`
                                <h2 class="text-3xl font-bold text-red-500 mb-6 text-center border-b border-gray-700 pb-2">GAME OVER</h2>
                                <div class="space-y-4 text-lg">
                                    <div class="flex justify-between text-gray-300">
                                        <span>Original Hiding Time:</span>
                                        <span class="font-mono font-bold text-white">${fmtStr(stats.finalElapsed)}</span>
                                    </div>
                                    <div class="flex justify-between text-green-400">
                                        <span>Total Bonus Time:</span>
                                        <span class="font-mono font-bold">+${fmtStr(stats.bonusMins * 60)}</span>
                                    </div>
                                    <div class="flex justify-between text-purple-400">
                                        <span>Percentage Multiplier:</span>
                                        <span class="font-mono font-bold">+${Math.round(stats.mult*100)}%</span>
                                    </div>
                                    <hr class="border-gray-700 my-4">
                                    <div class="flex justify-between text-2xl text-yellow-300 font-bold">
                                        <span>FINAL SURVIVAL TIME:</span>
                                        <span class="font-mono">${fmtStr(stats.finalTimeSeconds)}</span>
                                    </div>
                                </div>

                                <h3 class="text-lg font-bold text-blue-400 mt-6 mb-2 text-left">Game Log</h3>
                                <div class="max-h-40 overflow-y-auto bg-gray-900 p-3 rounded border border-gray-700 mb-4 pr-2 text-left">
                                    ${logHTML}
                                </div>

                                <div class="mt-4 flex flex-col gap-3">
                                    <button onclick="copyGameLog()" id="copyLogBtn" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3 px-4 rounded transition-colors shadow">
                                        📋 COPY GAMELOG
                                    </button>
                                    <button onclick="resetGameRoom()" class="w-full bg-gray-700 hover:bg-gray-600 border border-gray-600 text-white font-bold py-3 px-4 rounded transition-colors shadow">
                                        CLOSE
                                    </button>
                                </div>
                            `);
                        }
                    });
                }
            }
            
            if (needsRender) renderActiveCurses();
        }

        function beginHiding() {
            gamePhase = "HIDING";
            isPaused = false;
            countdownTarget = Date.now() + (15 * 60 * timeMultiplier * 1000);
            document.getElementById('startPhaseContainer').classList.add('hidden');
            document.getElementById('hidingControls').classList.remove('hidden');

        function startMainGame() {
            playHornSound();
            document.getElementById('hidingControls').classList.add('hidden');
            document.getElementById('hidingControls').classList.remove('flex');
            document.getElementById('moveControls').classList.add('hidden');
            document.getElementById('moveControls').classList.remove('flex');
            document.getElementById('mainControls').classList.remove('hidden');
            document.getElementById('mainControls').classList.add('flex');

            if (isPaused) {
                let duration = Date.now() - pauseTimestamp;
                if (gamePhase === "RUNNING") startTimestamp += duration;
                isPaused = false;
                pauseTimestamp = 0;
            }

            if (gamePhase === "PAUSED") {
                let pauseDuration = Date.now() - pauseTimestamp;
                startTimestamp += pauseDuration;
                for(let k in activeCurses) {
                    if(activeCurses[k].type === 'time' && activeCurses[k].expiresAt) {
                        activeCurses[k].expiresAt += pauseDuration;
                    }
                }
            } else if (gamePhase === "HIDING" || gamePhase === "IDLE") {
                startTimestamp = Date.now();
            }
            
            gamePhase = "RUNNING";
            logEvent("Phase Change", "Main Game Started (Seekers Released)");
            updatePauseUI();
            pushStateToFirebase();
        }

        function performDraw(count) {
            closeModal();
            
            let cursesUpdated = false;
            for (let name in activeCurses) {
                if (activeCurses[name].type === 'question') {
                    activeCurses[name].val--;
                    if (activeCurses[name].val <= 0) {
                        delete activeCurses[name];
                    }
                    cursesUpdated = true;
                }
            }
            if(cursesUpdated) {
                renderActiveCurses();
                pushStateToFirebase();
            }

            let drawn = [];
            for(let i=0; i<count; i++) {
                if(deck.length > 0) drawn.push(deck.pop());
            }

            if (drawn.length === 0) {
                showMessage("Empty Deck", "There are no remaining cards in the deck!");
                return;
            }

            if (divineBlessing) {
                hand.push(...drawn);
                pushStateToFirebase();
                showMessage("Divine Blessing", `Kept all ${drawn.length} cards drawn!`, checkLimit);
            } else {
                showPickScreen(drawn);
            }
        }

        function inspectDrawnCard(cardName, poolStrArray) {
            let data = CARD_DATA[cardName] || {desc: "Time Bonus", cost_str: "None"};

            let scaledDesc = getScaledDesc(data.desc);
            let scaledCost = getScaledCost(data.cost_str || 'None');

        function detailView(cardName, index) {

            let btnText = cardName === "Duplicate" ? "ACTIVATE DUPLICATE" : "CAST THIS CARD";

            window.tempCastAction = () => { handleCast(cardName, index, data); };
            
            showModal(`
                <h3 class="text-2xl font-bold text-blue-400 mb-2">${getDisplayName(cardName)}</h3>

                <div class="bg-gray-900 p-4 rounded mb-6 text-gray-300 text-sm leading-relaxed">
                    ${scaledDesc}
                </div>
                <div class="flex flex-col gap-3">
                    ${CARD_DATA[cardName] ? `<button onclick="tempCastAction()" class="bg-orange-600 hover:bg-orange-500 text-white font-bold py-3 rounded shadow-lg">${btnText}</button>` : ''}
                    <button onclick="inspectHand()" class="bg-gray-600 hover:bg-gray-500 text-white font-bold py-2 rounded">BACK</button>

        function handleCast(cardName, index, data) {
            let costType = data.cost_type;

            // Prevent casting "Discard Me" directly as a standalone card
            if (cardName === "Discard Me") {
                showMessage("Notice", "Discard Me cannot be cast on its own. Keep it in your hand to automatically pay the discard cost for other cards!");
                return;
            }

            // List all cost types that involve discarding cards
            let discardCostTypes = ['any', 'type', 'time_bonus', 'time_val', 'hand_all'];

            // Check if another Discard Me card is present in hand to pay the cost
            if (discardCostTypes.includes(costType)) {
                let dmIdx = hand.findIndex((c, i) => c === "Discard Me" && i !== index);
                if (dmIdx !== -1) {
                    showConfirm("Discard Me Available", "Use 'Discard Me' to pay the entire casting cost?", () => {
                        executeCast(cardName, index, data, [dmIdx]);
                    }, () => {
                        // If user declines Discard Me, proceed to standard payment
                        if (costType === "hand_all") {
                            showConfirm("Confirm Cast", "Discard entire hand to cast?", () => {
                                hand = [];
                                processEffect(cardName, data);
                            }, () => detailView(cardName, index));
                        } else {
                            initiateDiscardSelection(cardName, index, costType, data);
                        }
                    });
                    return;
                }
            }

            // Standard payment handlers when Discard Me is not used
            if (costType === "hand_all") {
                showConfirm("Confirm Cast", "Discard entire hand to cast?", () => {
                    hand = [];
                    processEffect(cardName, data);
                }, () => detailView(cardName, index));
                return;
            } 
            else if (costType === "duplicate") {
                duplicateSelector(index);
                return;
            } 
            else if (['any', 'type', 'time_bonus', 'time_val'].includes(costType)) {
                initiateDiscardSelection(cardName, index, costType, data);
                return;
            }

            executeCast(cardName, index, data, []);
        }
        
        function initiateDiscardSelection(cardName, cardIdx, costType, data) {
            let required = data.cost_val || 1;
            if (costType === "time_val") required *= timeMultiplier;
            
            let chosenIndices = [];
            let currentSum = 0;

            function renderSelectionStep() {
                let validIndices = [];
                for(let i=0; i<hand.length; i++) {
                    if (i === cardIdx || chosenIndices.includes(i)) continue;
                    let c = hand[i];
                    if (costType === "type" && !c.includes(data.cost_target)) continue;
                    if (costType === "time_bonus" && (c.startsWith("Curse") || !c.includes("min"))) continue;
                    if (costType === "time_val" && (c.startsWith("Curse") || !c.includes("min"))) continue;
                    validIndices.push(i);
                }

                if (validIndices.length === 0) {
                    showMessage("Error", "Not enough valid cards to discard to pay the cost.", () => detailView(cardName, cardIdx));
                    return;
                }

                let neededText = costType === "time_val" ? `${required - currentSum} more mins` : `${required - chosenIndices.length} more cards`;
                
                let buttonsHTML = validIndices.map(i => `
                    <button onclick="tempSelectAction(${i})" class="bg-gray-700 hover:bg-gray-600 text-white py-2 px-4 rounded mb-1 text-left border border-gray-600 hover:border-blue-400">
                        ${getDisplayName(hand[i])}
                    </button>
                `).join('');

                window.tempSelectAction = (idx) => {
                    chosenIndices.push(idx);
                    if (costType === "time_val") {
                        let valStr = hand[idx].replace("min","").trim();
                        currentSum += (parseInt(valStr) || 0) * timeMultiplier;
                    }
                    
                    let targetMet = costType === "time_val" ? currentSum >= required : chosenIndices.length >= required;
                    
                    if (targetMet) {
                        executeCast(cardName, cardIdx, data, chosenIndices);
                    } else {
                        renderSelectionStep();
                    }
                };

                showModal(`
                    <h3 class="text-xl font-bold text-red-400 mb-4">PAY COST (${neededText})</h3>
                    <p class="text-gray-300 mb-2">Select a card to discard:</p>
                    <div class="flex flex-col gap-1 max-h-64 overflow-y-auto">
                        ${buttonsHTML}
                    </div>
                    <button onclick="inspectHand()" class="mt-4 bg-gray-600 text-white py-2 px-4 rounded w-full">Cancel Cast</button>
                `);
            }

            renderSelectionStep();
        }

        function duplicateSelector(dupIdx) {
            let validIndices = hand.map((_, i) => i).filter(i => i !== dupIdx);
            if (validIndices.length === 0) {
                showMessage("Error", "No other cards in hand to duplicate!", inspectHand);
                return;
            }
            
            let buttonsHTML = validIndices.map(i => `
                <button onclick="tempDupAction(${i})" class="bg-gray-700 hover:bg-gray-600 text-white py-2 px-4 rounded mb-1 text-left border border-gray-600 hover:border-purple-400">
                    ${getDisplayName(hand[i])}
                </button>
            `).join('');

            window.tempDupAction = (targetIdx) => {
                hand[dupIdx] = hand[targetIdx];
                
                // Sync after duplicate alteration
                pushStateToFirebase();
                
                showMessage("Duplicated", `Duplicate card became: ${getDisplayName(hand[dupIdx])}`, inspectHand);
            };

            showModal(`
                <h3 class="text-xl font-bold text-purple-400 mb-4">DUPLICATE</h3>
                <p class="text-gray-300 mb-2">Choose a card to copy:</p>
                <div class="flex flex-col gap-1 max-h-64 overflow-y-auto">
                    ${buttonsHTML}
                </div>
                <button onclick="inspectHand()" class="mt-4 bg-gray-600 text-white py-2 px-4 rounded w-full">Cancel</button>
            `);
        }

        function executeCast(cardName, mainIdx, data, discardIndices) {
            let costNames = discardIndices.length > 0 ? discardIndices.map(i => getDisplayName(hand[i])).join(", ") : "None";
            logEvent("Card Cast", `${getDisplayName(cardName)} (Cost paid: ${costNames})`);

            let indicesToRemove = [...new Set([mainIdx, ...discardIndices])].sort((a,b) => b - a);
            for(let idx of indicesToRemove) {
                hand.splice(idx, 1);
            }
            processEffect(cardName, data); // processEffect handles the pushStateToFirebase
            
            if (gamePhase !== "PAUSED") {
                showMessage("Success", `${getDisplayName(cardName)} activated!`,checkLimit, inspectHand);
            } else {
                closeModal();
            }
        }

        function processEffect(cardName, data) {
            if (cardName === "Curse of the 1-Minute King") {
                deck = deck.filter(c => c !== "1min");
                showMessage(getDisplayName(cardName), `All ${1 * timeMultiplier}min cards removed from deck.`);
            }
            if (cardName === "Curse of the Divine Blessing") divineBlessing = true;
            if (cardName === "Curse of the Tiny Home") tinyHomeActive = true;
            if (cardName === "Curse of the Sniper") {
                setTimeout(() => {
                    if (gamePhase === "RUNNING") {
                        maxHandSize = 999;
                        let added = 0;
                        for(let i=0; i<5; i++) {
                            if(deck.length > 0) { hand.push(deck.pop()); added++; }
                        }
                        pushStateToFirebase(); // Sync infinite hand
                        showMessage("Sniper Survival", `You survived! Hand size is infinite and ${added} cards added.`, checkLimit);
                    }
                }, 60000); //hardcoded 60 seconds for sniper curse
            }
            if (cardName === "Curse of the Open Mind") {
                maxHandSize = 999;
                showMessage("Limit Removed", "Hand size limit removed!");
            }

            if (data.auto_draw) {
                for(let i=0; i<data.auto_draw; i++) {
                    if(deck.length > 0) hand.push(deck.pop());
                }
            }
            if (data.expand) maxHandSize += data.expand;

            if (cardName === "Move") {
                gamePhase = "PAUSED";
                pauseTimestamp = Date.now();
                document.getElementById('mainControls').classList.add('hidden');
                document.getElementById('mainControls').classList.remove('flex');
                document.getElementById('moveControls').classList.remove('hidden');
                document.getElementById('moveControls').classList.add('flex');
            }

            const curseMapping = { //curse mapping
                "Curse of the Obesity": {mode: "time", val: 10 * 60 * timeMultiplier},
                "Curse of the Render Distance": {mode: "time", val: 10 * 60 * timeMultiplier},
                "Curse of the Broken Compass": {mode: "time", val: 15 * 60 * timeMultiplier},
                "Curse of the Single Perspective": {mode: "time", val: 15 * 60 * timeMultiplier},
                "Curse of the Confusion": {mode: "time", val: 15 * 60 * timeMultiplier},
                "Curse of the Urban Parkour": {mode: "button"},
                "Curse of the Bullseye": {mode: "button"},
                "Curse of the Leap of Faith": {mode: "button"},
                "Curse of the Track Walker": {mode: "button"},
                "Curse of the Rooftop Zip": {mode: "button"},
                "Curse of the Urban Scavenger": {mode: "button"},
                "Curse of the Minecraft Geoguessr": {mode: "button"},
                "Curse of the Drained Brain": {mode: "forever"},
                "Curse of the Bridge Troll": {mode: "question", val: 1},
                "Curse of the Open Mind": {mode: "forever"},
                "Curse of the Gilded Inquiry": {mode: "button"},
                "Curse of the Hide-And-Seek-Ception": {mode: "button"},
                "Curse of the Divine Blessing": {mode: "forever"},
                "Curse of the Untethered Spirit": {mode: "forever"},
                "Curse of the Plagued Word": {mode: "time", val: 30 * 60 * timeMultiplier},
                "Curse of the 1-Minute King": {mode: "forever"},
                "Curse of the Tiny Home": {mode: "forever"},
                "Curse of the Express Route": {mode: "time", val: 5 * 60 * timeMultiplier},
                "Curse of the Sniper": {mode: "time", val: 60 * timeMultiplier},
                "Curse of the Freewheeler": {mode: "question", val: 3},
                "Curse of the U-Turn": {mode: "button"},
                "Veto": {mode: "time", val: 60 * timeMultiplier},
                "Randomize": {mode: "time", val: 60 * timeMultiplier}
            };
            if (curseMapping[cardName]) {
                let dispName = cardName.replace("Curse of the ", "");
                let curseData = { type: curseMapping[cardName].mode };
                
                if (curseMapping[cardName].mode === 'time') {
                    curseData.expiresAt = (isPaused ? pauseTimestamp : Date.now()) + (curseMapping[cardName].val * 1000);
                } else if (curseMapping[cardName].mode === 'question') {
                    curseData.val = curseMapping[cardName].val;
                }
                activeCurses[dispName] = curseData;
                renderActiveCurses();
                playCurseSound();
            }
            
            updateHandBadge();
            pushStateToFirebase(); // Assures the effects and discarded hand syncs over
        }

        function openDistanceCalculator() {
            let optionsHTML = STATIONS.map(s => `<option value="${s.name}">`).join('');
            
            window.calcDistAction = () => {
                let startName = document.getElementById('distStart').value.trim().toLowerCase();
                let endName = document.getElementById('distEnd').value.trim().toLowerCase();
                let resLabel = document.getElementById('distResult');
                
                let start = STATIONS.find(s => s.name === startName);
                let end = STATIONS.find(s => s.name === endName);
                
                if(!start || !end) {
                    resLabel.innerHTML = "<span class='text-orange-400'>Please select valid stations from list.</span>";
                    return;
                }
                
                let dx = start.mc_x - end.mc_x;
                let dz = start.mc_z - end.mc_z;
                let dist = Math.sqrt(dx*dx + dz*dz);
                
                let color = "text-red-500";
                if(dist < 1000) color = "text-green-500";
                else if(dist < 2000) color = "text-yellow-400";
                
                resLabel.innerHTML = `<span class="${color} font-bold text-lg">${dist.toFixed(1)} blocks</span>`;
            };

            showModal(`
                <h3 class="text-xl font-bold text-white mb-4">Distance Calculator</h3>
                
                <label class="block text-gray-300 text-sm font-bold mb-2">Start Station:</label>
                <input list="stationsList" id="distStart" class="w-full bg-gray-700 text-white rounded p-2 mb-4 outline-none focus:ring-2 focus:ring-blue-500" placeholder="Type to search...">
                
                <label class="block text-gray-300 text-sm font-bold mb-2">End Station:</label>
                <input list="stationsList" id="distEnd" class="w-full bg-gray-700 text-white rounded p-2 mb-4 outline-none focus:ring-2 focus:ring-blue-500" placeholder="Type to search...">
                
                <datalist id="stationsList">
                    ${optionsHTML}
                </datalist>
                
                <div id="distResult" class="text-center min-h-[30px] mb-4"></div>
                
                <div class="flex gap-2">
                    <button onclick="calcDistAction()" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 rounded">Calculate</button>
                    <button onclick="closeModal()" class="flex-1 bg-gray-600 hover:bg-gray-500 text-white font-bold py-2 rounded">Close</button>
                </div>
            `);
        }

        function confirmEndGame() {
            showConfirm("END GAME", "Are you sure you want to end the game and calculate the final score?", () => {
                if(gameLoopInterval) {
                    clearInterval(gameLoopInterval);
                    gameLoopInterval = null;
                }

                // If paused, end game at the moment of pause without counting pause duration
                let currentEndTime = isPaused ? pauseTimestamp : Date.now();
                let finalElapsed = Math.max(0, Math.floor((currentEndTime - startTimestamp) / 1000));

                gamePhase = "IDLE";
                isPaused = false;
                pushStateToFirebase();
                
                let bonusMins = 0;
                let mult = 0;
                
                hand.forEach(c => {
                    if(!c.startsWith("Curse") && c.includes("min")) {
                        let val = parseInt(c.replace("min", ""));
                        if(!isNaN(val)) bonusMins += (val * timeMultiplier);
                    }
                    if(c.includes("5%")) mult += 0.05;
                });
                
                if (tinyHomeActive) bonusMins *= 1.5;
                
                let baseTotal = finalElapsed + (bonusMins * 60);
                let finalTimeSeconds = baseTotal * (1 + mult);
                
                const fmtStr = (sec) => {
                    let h = Math.floor(sec/3600);
                    let m = Math.floor((sec%3600)/60);
                    let s = Math.floor(sec%60);
                    return h > 0 ? `${h}h ${m}m ${s}s` : `${m}m ${s}s`;
                };

                logEvent("Game Ended", `Final Survival Time: ${fmtStr(finalTimeSeconds)}`);

                gamePhase = "GAME_OVER";

                update(gameStateRef, {
                gamePhase: "GAME_OVER",
                finalStats: {
                finalElapsed: finalElapsed,
                bonusMins: bonusMins,
                mult: mult,
                finalTimeSeconds: finalTimeSeconds
                }
              });

                let logHTML = gameLog.length > 0 
                    ? gameLog.map(entry => `<div class="font-mono text-xs text-gray-300 border-b border-gray-800 py-1">${entry}</div>`).join('') 
                    : '<p class="text-gray-400 italic">No events logged yet.</p>';

                showModal(`
                    <h2 class="text-3xl font-bold text-red-500 mb-6 text-center border-b border-gray-700 pb-2">GAME OVER</h2>
                    <div class="space-y-4 text-lg">
                        <div class="flex justify-between text-gray-300">
                            <span>Original Hiding Time:</span>
                            <span class="font-mono font-bold text-white">${fmtStr(finalElapsed)}</span>
                        </div>
                        <div class="flex justify-between text-green-400">
                            <span>Total Bonus Time:</span>
                            <span class="font-mono font-bold">+${fmtStr(bonusMins * 60)}</span>
                        </div>
                        <div class="flex justify-between text-purple-400">
                            <span>Percentage Multiplier:</span>
                            <span class="font-mono font-bold">+${Math.round(mult*100)}%</span>
                        </div>
                        <hr class="border-gray-700 my-4">
                        <div class="flex justify-between text-2xl text-yellow-300 font-bold">
                            <span>FINAL SURVIVAL TIME:</span>
                            <span class="font-mono">${fmtStr(finalTimeSeconds)}</span>
                        </div>
                    </div>
    
                    <h3 class="text-lg font-bold text-blue-400 mt-6 mb-2 text-left">Game Log</h3>
                    <div class="max-h-40 overflow-y-auto bg-gray-900 p-3 rounded border border-gray-700 mb-4 pr-2 text-left">
                        ${logHTML}
                    </div>

                    <div class="mt-4 flex flex-col gap-3">
                        <button onclick="copyGameLog()" id="copyLogBtn" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3 px-4 rounded transition-colors shadow">
                            📋 COPY GAMELOG
                        </button>
                        <button onclick="resetGameRoom()" class="w-full bg-gray-700 hover:bg-gray-600 border border-gray-600 text-white font-bold py-3 px-4 rounded transition-colors shadow">
                            CLOSE
                        </button>
                    </div>
                `);
            });
        }
    </script>
</body>
</html>
